      <script>
         // 弹出 Toast
         let toastTimer = null;
         let toastEl = null;
         const toast = (innerHTML, timeoutMs = 2000) => {
            if (!toastEl) {
               toastEl = document.createElement('div');
               toastEl.id = 'toast';
               document.body.appendChild(toastEl);
            }

            if (toastTimer) {
               clearTimeout(toastTimer);
               toastTimer = null;
            }

            toastEl.classList.remove('show', 'hide');
            void toastEl.offsetWidth;
            toastEl.innerHTML = innerHTML;
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
               toastEl.classList.remove('show');
               toastEl.classList.add('hide');
               const onFinish = () => {
               toastEl.removeEventListener('animationend', onFinish);
               toastEl.classList.remove('hide');
               };
               toastEl.addEventListener('animationend', onFinish);
               toastTimer = null;
            }, timeoutMs);
         }
         // 单行图片处理
         document.querySelectorAll('.post-content > .content p > img:only-child').forEach((img) => {
            if (img.parentNode.childNodes.length > 1) return;
            img.parentElement.classList.add('figure');
            img.classList.add('only-child');
            const alt = document.createElement('div');
            alt.classList.add('image-alt');
            alt.innerText = img.getAttribute('alt');
            img.parentElement.append(alt);
         });
         // 图片点击放大
         document.querySelectorAll('.post-content > .content img').forEach((img) => {
            img.addEventListener('click', () => {
               window.open(img.getAttribute('src'));
            })
         });
         // 为标题添加 id
         document.querySelectorAll('h1, h2, h3, h4').forEach((title) => {
            title.id = title.innerText;
         })
         // 文章目录
         const postTitles = document.querySelector('.post-menu .titles');
         const titleElements = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4');
         if (titleElements.length > 1) {
            // 查找标题、插入到 .titles 中，并根据类型设置加粗 / 左间距
            let titleElementMin = "H9";
            titleElements.forEach(el => {
               if (el.tagName < titleElementMin) titleElementMin = el.tagName;
            });
            titleElements.forEach(el => {
               const a = document.createElement('a');
               a.href = `#${el.id}`;
               a.innerText = el.innerText.replace(/\[[^\]]+\]/g, '');
               if (el.tagName == titleElementMin) a.style.fontWeight = '600';
               a.style.marginLeft = { "H1": '0', "H2": '0.5rem', "H3": '1rem', "H4": '1.5rem' }[el.tagName];
               postTitles.appendChild(a);
            });
         }
            // Hover 左下角按钮时展开
            const ptContainer = document.querySelector('.post-menu .titles-container');
            ptContainer.style.setProperty('--width', `${postTitles.offsetWidth}px`);
            ptContainer.style.setProperty('--height', `${postTitles.offsetHeight}px`);
            new ResizeObserver(entries => {
               for (let entry of entries) {
                  if (entry.target == postTitles) {
                     ptContainer.style.setProperty('--width', `${postTitles.offsetWidth}px`);
                     ptContainer.style.setProperty('--height', `${postTitles.offsetHeight}px`);
                  }
               }
            }).observe(postTitles);
            // 回到顶部
            document.querySelector('.post-menu .icon').addEventListener('click', () => {
               window.scrollTo({
                  top: 0,
                  behavior: "smooth"
               });
            })
         // 分享文章 & 查看源代码
         document.querySelector('#share-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(`${document.title}\n${window.location.href}`)
               .then(() => {
                  toast('已复制到剪贴板');
               })
         });
         document.querySelector('#view-source-btn').addEventListener('click', () => {
            window.open('https://cdn.jsdelivr.net/gh/waterblock79/waterblock79.github.io@main/sources/跨年游戏剪辑.md');
         });
      </script>
